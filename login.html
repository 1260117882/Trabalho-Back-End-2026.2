<!DOCTYPE html>
<html lang="pt-br">

  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Aluguel de Filmes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  </head>

  <body class="bg-dark">
    
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="card shadow">
            <div class="card-body p-4">
              
              <h1 class="text-center mb-4">Aluguel de Filmes</h1>
              
              <h2 class="h4 text-center mb-4">Login</h2>
              
              <form action="index.html">
                
                <div class="mb-3">
                  
                  <label for="email" class="form-label">E-mail</label>
                  
                  <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Digite seu e-mail">

            </div>

            <div class="mb-3">
              
              <label for="senha" class="form-label">Senha</label>
              
              <input
              type="password"
              class="form-control"
              id="senha"
              placeholder="Digite sua senha">

            </div>            
       
           <button type="submit" class="btn btn-dark w-100">Entrar</button>
          
          </form>
          
          <hr class="my-4">
          
          <div class="text-center">
            
            <p class="mb-2">Ainda não tem uma conta?

      </p>
        
          <a href="cadastro.html" class="btn btn-outline-dark">Cadastre-se</a>

          </div>

          </div>

      </div>

        </div>

      </div>

    </div>

  </body>

</html>
