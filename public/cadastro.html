<!DOCTYPE html>
<html lang="pt-br">

  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Aluguel de Filmes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  </head>

  <body class="bg-dark">
    
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
          <div class="card shadow">
            <div class="card-body p-4">
              
              <h1 class="text-center mb-2">Aluguel de Filmes</h1>
              
              <h2 class="h4 text-center mb-4">Crie uma conta</h2>
              
              <form action="login.html">
                
                <div class="mb-3">
                  
                  <label for="nome" class="form-label">Nome completo</label>
                  
                  <input
                  type="text"
                  class="form-control"
                  id="nome"
                  placeholder="Digite seu nome completo">

                </div>

            <div class="mb-3">
              
              <label for="email" class="form-label">E-mail</label>
              
              <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Digite seu e-mail">

            </div>

            <div class="mb-3">
              
              <label for="dataNascimento" class="form-label">Data de nascimento</label>
              
              <input
              type="date"
              class="form-control"
              id="dataNascimento">

            </div>

            <div class="mb-3">
              
              <label for="telefone" class="form-label">Telefone</label>
              
              <input
              type="tel"
              class="form-control"
              id="telefone"
              placeholder="(21) 99999-9999">

            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              
              <input
              type="password"
              class="form-control"
              id="senha"
              placeholder="Digite sua senha">

            </div>

            <div class="mb-4">
              
              <label for="confirmarSenha" class="form-label">Confirmar senha</label>
              
              <input
              type="password"
              class="form-control"
              id="confirmarSenha"
              placeholder="Digite sua senha novamente">

            </div>

            <div class="col-12 mt-3">
              <div class="form-check">
                
                <label class="form-check-label text-muted" for="termos"> Aceito os Termos de Uso e Política de Privacidade. <span class="text-danger">*</span></label>
                
                <input
                class="form-check-input"
                type="checkbox"
                id="termos">

            <div class="col-12 mt-3">
              <div class="form-check">
                
                <label class="form-check-label text-muted" for="newsletter">Quero receber novidades, lançamentos e ofertas de filmes por e-mail.</label>
                
                <input
                class="form-check-input"
                type="checkbox"
                id="newsletter">

              </div>

            </div>

              </div>

            </div>
      
        <button type="submit" class="btn btn-dark w-100">Cadastrar</button>

        </form>
        
        <hr class="my-4">
        
        <div class="text-center">
          
          <p class="mb-2">Já possui uma conta?</p>

          <a href="login.html" class="btn btn-outline-dark">Entrar</a>

        </div>
      </div>
    </div>

      </div>

  </body>

</html>
