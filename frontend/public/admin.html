<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar filmes - Aluga Filmes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>

  <body>

    <nav class="navbar sticky-top navbar-dark bg-dark">
      <div class="container-fluid">
        <div class="navbar-nav d-flex flex-row gap-4 mx-auto">
          <a class="nav-link text-uppercase" href="index.html">Início</a>
          <a class="nav-link text-uppercase" href="index.html#catalogo">Catálogo</a>
          <a class="nav-link text-uppercase active" href="admin.html">Gerenciar filmes</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <h1 class="h3 mb-4">Gerenciar filmes</h1>

      <!-- Mensagens de sucesso e de erro (200, 400, 404, 409...) aparecem aqui -->
      <div id="mensagem"></div>

      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
          <thead>
            <tr><th>ID</th><th>Título</th><th>Gênero</th><th>Preço</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tabela-filmes">
            <tr><td colspan="6" class="text-center text-muted">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Modal de edição (PUT) -->
    <div class="modal fade" id="modal-editar" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form-editar">
          <div class="modal-header">
            <h2 class="modal-title h5">Editar filme</h2>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div id="erro-modal" class="alert alert-danger d-none"></div>
            <input type="hidden" id="f-id">

            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="f-titulo">Título</label>
                <input class="form-control" id="f-titulo" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="f-genero">Gênero</label>
                <input class="form-control" id="f-genero">
              </div>
              <div class="col-12">
                <label class="form-label" for="f-sinopse">Sinopse</label>
                <textarea class="form-control" id="f-sinopse" rows="3"></textarea>
              </div>
              <div class="col-md-3">
                <label class="form-label" for="f-ano">Ano</label>
                <input type="number" class="form-control" id="f-ano">
              </div>
              <div class="col-md-3">
                <label class="form-label" for="f-duracao">Duração (min)</label>
                <input type="number" class="form-control" id="f-duracao">
              </div>
              <div class="col-md-3">
                <label class="form-label" for="f-classificacao">Classificação</label>
                <input class="form-control" id="f-classificacao">
              </div>
              <div class="col-md-3">
                <label class="form-label" for="f-preco">Preço (R$)</label>
                <input type="number" step="0.01" class="form-control" id="f-preco">
              </div>
              <div class="col-md-8">
                <label class="form-label" for="f-imagem">Imagem (nome do arquivo)</label>
                <input class="form-control" id="f-imagem" placeholder="filme1.jpg">
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="f-disponivel">
                  <label class="form-check-label" for="f-disponivel">Disponível</label>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-danger">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
