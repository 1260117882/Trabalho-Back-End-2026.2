spring.application.name=backend

# Conexão com o PostgreSQL. No Docker, o host será o nome do serviço ("db").
# Podem ser sobrescritos por variáveis de ambiente (SPRING_DATASOURCE_URL etc.).
spring.datasource.url=jdbc:postgresql://localhost:5432/rentafilm
spring.datasource.username=postgres
spring.datasource.password=postgres

# O banco é criado pelos scripts SQL; o Hibernate só valida a estrutura.
spring.jpa.hibernate.ddl-auto=validate

server.port=8080